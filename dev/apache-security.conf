# Limit exposure of legacy project files even in the local-only environment.
<Directory /var/www/html/SchoolERP>
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/www/html/SchoolERP/application>
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/system>
    Require all denied
</Directory>
# Don't serve source control metadata, developer tools or project documentation.
<Directory /var/www/html/SchoolERP/.git>
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/.github>
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/.devcontainer>
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/dev>
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/docs>
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/user_guide>
    Require all denied
</Directory>
<Directory "/var/www/html/SchoolERP/SchoolERP Docs">
    Require all denied
</Directory>
<Directory /var/www/html/SchoolERP/uploads>
    php_admin_flag engine off
    Options -ExecCGI
</Directory>
<FilesMatch "\.(sql|md|env|json|lock|ya?ml)$">
    Require all denied
</FilesMatch>
